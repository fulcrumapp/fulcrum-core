name: Publish to npmjs.org (Trusted Publisher)

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Stable version tag to publish, for example v1.2.3.
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npmjs-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
          registry-url: https://registry.npmjs.org/

      - name: Install package managers
        run: npm install --global npm@11.5.1 yarn@1.22.22 --ignore-scripts

      - name: Verify release tag and commit
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "::error::A stable SemVer tag is required"
            exit 1
          }
          version=$(node -p "require('./package.json').version")
          [[ "$version" == "${TAG#v}" ]] || {
            echo "::error::package.json version $version does not match $TAG"
            exit 1
          }
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            export GITHUB_REF="refs/tags/$TAG"
            export GITHUB_SHA="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          fi
          node .github/actions/npm-publish-github/publish.js verify

      - name: Install dependencies
        run: yarn install --frozen-lockfile --production=false --ignore-scripts --non-interactive

      - name: Build package
        run: yarn build

      - name: Pack package
        id: pack
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/npm-pack.json"
          file=$(node -e 'const p=require(process.argv[1]); if (!Array.isArray(p) || p.length !== 1 || !/^[A-Za-z0-9._-]+\.tgz$/.test(p[0].filename)) process.exit(1); console.log(p[0].filename)' "$RUNNER_TEMP/npm-pack.json")
          tar -xOzf "$RUNNER_TEMP/$file" package/package.json > "$RUNNER_TEMP/npm-pack-package.json"
          node -e 'const p=require(process.argv[1]); if(p.name !== "@fulcrumapp/fulcrum-core" || p.version !== process.env.TAG.slice(1)) { console.error("Packed package does not match the tag"); process.exit(1); }' "$RUNNER_TEMP/npm-pack-package.json"
          echo "file=$RUNNER_TEMP/$file" >> "$GITHUB_OUTPUT"

      - name: Check existing version
        id: existing
        env:
          TARBALL: ${{ steps.pack.outputs.file }}
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if response=$(npm view "$name@$version" version --json --registry=https://registry.npmjs.org/ --@fulcrumapp:registry=https://registry.npmjs.org/); then
            [[ "$(jq -r . <<<"$response")" == "$version" ]] || { echo "::error::Registry returned a mismatched version"; exit 1; }
            stored=$(npm view "$name@$version" dist.integrity --json --registry=https://registry.npmjs.org/ --@fulcrumapp:registry=https://registry.npmjs.org/)
            expected=$(node -e 'const fs=require("fs"),c=require("crypto"); console.log("sha512-"+c.createHash("sha512").update(fs.readFileSync(process.env.TARBALL)).digest("base64"))')
            [[ "$(jq -r . <<<"$stored")" == "$expected" ]] || { echo "::error::Existing npm version has different package contents"; exit 1; }
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif jq -e '.error.code == "E404"' <<<"$response" >/dev/null 2>&1; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unable to query npmjs.org for $name@$version"
            exit 1
          fi

      - name: Publish to npmjs.org
        if: steps.existing.outputs.published != 'true'
        env:
          TARBALL: ${{ steps.pack.outputs.file }}
        run: npm publish "$TARBALL" --ignore-scripts --registry=https://registry.npmjs.org/ --@fulcrumapp:registry=https://registry.npmjs.org/ --provenance --access public
