name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build-and-test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: yarn

      - name: Preserve CI configuration
        uses: actions/upload-artifact@v7.0.2
        with:
          name: npm-ci-config-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci/config.yaml
          if-no-files-found: error
          archive: true

      - name: Install dependencies
        run: yarn install --frozen-lockfile --production=false --ignore-scripts

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test

  tag:
    name: Create npm release tag
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.repository }}-npm-release-tag
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.14.0'
          package-manager-cache: false
      - name: Create scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ secrets.FULCRUM_CI_APP_ID }}
          private-key: ${{ secrets.FULCRUM_CI_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Create release-only commit and tag
        uses: $/.github/actions/npm-create-tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CHECK_NPMJS: 'true'
